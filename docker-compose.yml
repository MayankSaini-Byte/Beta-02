version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: kitchensync-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: kitchensync-api
    restart: unless-stopped
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/kitchensync
      JWT_SECRET: change-me-in-production
      MODEL_SERVICE_URL: http://model-service:8000
      MODEL_TIMEOUT_MS: "60000"
    ports:
      - "5000:5000"
    # The API also serves frontend/dist if it exists (build it before docker build:
    #   cd frontend && npm install && npm run build )
    volumes:
      - ./frontend/dist:/app/public:ro
    depends_on:
      - mongo
      - model-service

  model-service:
    build: ./model-service
    container_name: kitchensync-model
    restart: unless-stopped
    environment:
      RECEIPT_MODEL_DIR: /models/.receipt-models
    volumes:
      - receipt-models:/models
    expose:
      - "8000"

volumes:
  mongo-data:
  receipt-models:
