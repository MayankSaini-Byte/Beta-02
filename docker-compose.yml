version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: kitchensync-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: kitchensync-api
    restart: unless-stopped
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/kitchensync
      JWT_SECRET: change-me-in-production
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    # The API also serves frontend/dist if it exists (build it before docker build:
    #   cd frontend && npm install && npm run build )
    volumes:
      - ./frontend/dist:/app/public:ro

volumes:
  mongo-data:
